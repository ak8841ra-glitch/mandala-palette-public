<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
<title>Mandala palette — free floral field</title>
<desc>外周の淡い花びらと中央付近の大小の小花が、枚数や位置を限定せず自由なカード配置を支えるフィールド。</desc>
